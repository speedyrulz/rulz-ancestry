name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: End-to-end tests against the production build
        run: |
          pnpm build
          pnpm test:e2e

      - name: Build the installer and test the packaged app
        run: |
          pnpm package
          pnpm test:e2e:packaged

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: apps/desktop/release/*.exe
          retention-days: 7
          if-no-files-found: error
