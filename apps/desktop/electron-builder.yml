appId: com.rulz.kinspora
productName: RulZ Kinspora
copyright: Copyright © 2026 RulZ Kinspora contributors

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  # better-sqlite3 ships prebuilt binaries for every platform plus its C
  # sources. Only the Windows x64 binary is needed at runtime.
  - '!node_modules/better-sqlite3/{deps,src,binding.gyp}'
  - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
  - '!node_modules/node-addon-api/**'

# Native binaries cannot be loaded from inside the asar archive.
asarUnpack:
  - '**/*.node'
  # The connector of the optional AI assistant: an AI app reads these two
  # files from outside the app, so they cannot lie inside its archive.
  - 'out/connector/**'

# better-sqlite3 13 uses N-API prebuilt binaries that work in Electron as-is,
# so there is nothing to recompile against Electron's headers.
npmRebuild: false

# The window icon. The packaged app loads resources/icon.png, which is
# path.join(process.resourcesPath, 'icon.png'). The executable and the
# installer icons are build/icon.ico.
extraResources:
  - from: build/icon.png
    to: icon.png

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  # The directory page is closed. A chosen folder can be the one that holds
  # the user's trees, and an uninstall would then remove them. A per-user
  # install goes to %LOCALAPPDATA%\Programs\<product name>.
  allowToChangeInstallationDirectory: false
  # The profile, trees and packs live outside the install folder and must
  # survive an uninstall.
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: RulZ-Kinspora-Setup-${version}.${ext}

# A tag build uploads with --publish always to a draft, which the release
# workflow publishes once every file is on it. `pnpm package` passes
# --publish never, so a local package and CI do not upload.
publish:
  provider: github
  owner: speedyrulz
  repo: rulz-kinspora
  releaseType: draft
